name: Release
run-name: Release (${{ inputs.bump }}) by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: studymate-release-main
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'Miaotofu01/Study-Mate' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    # 等待窗口本身就要 30 分钟（scripts/release/release.mjs 的 npm 异步入库等待），
    # 20 分钟会把还在正常等待的任务掐掉。
    timeout-minutes: 40
    environment: npm
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BUMP: ${{ inputs.bump }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      # npm 异步入库的等待上限；要临时加长就调这里，别超上面的 job 超时。
      RELEASE_NPM_WAIT_SECONDS: '1800'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11 --ignore-scripts
      - name: Prepare changelog, version commit and tag
        run: node scripts/release/release.mjs prepare
      - name: Build plugin ZIP, publish npm through OIDC, and attach ZIP to GitHub Release
        run: node scripts/release/release.mjs publish
