# 学习者记忆 —— 跨科目、跨会话的共享记忆。
#
# 按下面的分节增补与修正，不做整篇重写；每条一行，写在对应的键下面。
# 这份文件是这个 Agent 随人调整的地方：讲法偏好写在这里，优先级高于任何通用指引。

我是谁:
  现有技能: []
  各领域当前水平: []

教学偏好:
  有效的讲法: []
  容易烦躁的: []
  例子偏好: []

学习习惯:
  可投入时间: []
  节奏: []
  常见卡点: []

# 积累 —— 换一门课还成立的做法与事实（这台机器上的脾气、踩过的坑、验过的工序）。
# 一条 = 中文键 + 一句话：键是索引（要读哪一条就 grep 键），话要能泛化、不绑当前场景。
# 值以指示符开头（`*`、`&`、`!` 这类，例如 `**先动手**再补理论`）必须加引号，写成 "**先动手**再补理论"——
# 裸写会被 YAML 当成别名／标签拒掉，这份记忆就当场打不开了。上面三节与「积累」一样。
# 这一节**不进任何注入**：答疑开张、工作区摘要、图片库载荷都只取上面三节。
积累: {}
