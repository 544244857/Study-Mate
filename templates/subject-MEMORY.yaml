# 科目记忆 —— **只对这门课成立**的做法与事实（换一门课还成立的写共享记忆）。
#
# 它是这份骨架被复制到 `<subject_path>/MEMORY.yaml`（科目目录下）之后的样子：
# 建科目时预置的就是这个空骨架，之后角色按需在末尾追加条目。
# 按下面的分节增补与修正，不做整篇重写；每条一行，写在对应的键下面。

# 积累 —— 只在这门课里成立的做法与事实（这门课的环境、踩过的坑、验过的工序）。
# 一条 = 中文键 + 一句话：键是索引（要读哪一条就 grep 键），话要能泛化、不绑当前节点。
# 值以指示符开头（`*`、`&`、`!` 这类，例如 `**先动手**再补理论`）必须加引号，写成 "**先动手**再补理论"——
# 裸写会被 YAML 当成别名／标签拒掉，这份记忆就当场打不开了。
# 这一节**不进任何注入**：答疑开张、工作区摘要、图片库载荷都只取共享记忆的画像三节——
# 它是给角色干活用的笔记，角色按「文件归属」找到这份文件、按需 grep 键去读。
积累: {}
